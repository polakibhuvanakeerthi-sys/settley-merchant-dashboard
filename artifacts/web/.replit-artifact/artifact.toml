kind = "web"
previewPath = "/"
title = "Merchant Reconciliation Dashboard"
description = "A responsive merchant payment reconciliation dashboard for monitoring transaction volume, settlement health, payout mismatches, and exception resolution."
version = "1.0.0"
id = "artifacts/web"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22333

[services.development]
run = "pnpm --filter @workspace/web run dev"
[services.production]
[services.production.build]
args = ["pnpm", "--filter", "@workspace/web", "run", "build"]

[services.production.run]
args = ["pnpm", "--filter", "@workspace/web", "run", "serve"]
[services.env]
PORT = "22333"
BASE_PATH = "/"
